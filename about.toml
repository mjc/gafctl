accepted = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-3-Clause",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "MIT-0",
    "BSD-2-Clause",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
ignore-dev-dependencies = true

[private]
ignore = true

# Clarifications preserve exact published license files. See
# packaging/license-reference/README.md for cached files absent from crates.
# The generation script materializes @GAFCTL_LICENSE_REFERENCE@ as an absolute
# path and checks cached source package versions before invoking cargo-about.

