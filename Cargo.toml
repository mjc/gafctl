[package]
name = "gafctl"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mjc/gafctl"
rust-version = "1.98.1"
publish = false
description = "A Rust proxy for GAF Master Flow attic fans"
readme = "README.md"
keywords = ["attic-fan", "gaf", "home-assistant", "ventilation"]
default-run = "gafctl"

[features]
default = ["http", "mqtt", "cli"]
http = [
    "dep:axum",
    "dep:base64",
    "dep:clap",
    "dep:clap_complete",
    "dep:httpdate",
    "dep:reqwest",
    "dep:serde_json",
    "dep:tempfile",
    "dep:tokio-stream",
]
mqtt = ["http", "dep:rumqttc_next"]
cli = ["dep:clap", "dep:clap_complete", "dep:reqwest", "dep:serde_json"]

[lints.clippy]
disallowed_macros = "deny"
panic = "deny"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "tracing"], optional = true }
backon = { version = "1.6.0", default-features = false, features = ["std"] }
base64 = { version = "0.23.1", optional = true }
btleplug = "0.13.3"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"], optional = true }
clap_complete = { version = "4.6.11", optional = true }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
httpdate = { version = "1.0.3", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"], optional = true }
rumqttc_next = { package = "rumqttc-next", version = "0.34.0", default-features = false, features = ["stream"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", optional = true }
strum = { version = "0.28.0", default-features = false, features = ["derive"] }
tempfile = { version = "3.27.0", optional = true }
thiserror = "2.0.21"
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-util = { version = "0.7.18", default-features = false, features = ["rt"] }
tokio-stream = { version = "0.1.19", default-features = false, features = ["sync", "time"], optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
bluez-async = "0.8.2"

[[bin]]
name = "gafctl-server"
path = "src/main.rs"
required-features = ["http"]

[[bin]]
name = "gafctl"
path = "src/bin/gafctl.rs"
required-features = ["cli"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["http", "cli"]

[[test]]
name = "client_http"
path = "tests/client_http.rs"
required-features = ["cli"]

[[test]]
name = "quickconnect_auth"
path = "tests/quickconnect_auth.rs"
required-features = ["http"]

[dev-dependencies]
assert_cmd = "2.2.2"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "tracing"] }
http-body-util = "0.1"
serde_json = "1.0.151"
tokio = { version = "1.53.1", default-features = false, features = ["test-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
dbus = "0.9.12"
