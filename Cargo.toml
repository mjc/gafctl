[package]
name = "gafctl"
version = "0.1.0"
edition = "2024"
description = "A Rust proxy for GAF Master Flow attic fans"
readme = "README.md"
keywords = ["attic-fan", "gaf", "home-assistant", "ventilation"]
default-run = "gafctl"

[features]
default = ["http", "mqtt", "cli"]
http = [
    "dep:axum",
    "dep:clap",
    "dep:clap_complete",
    "dep:futures-util",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:gafctl-quickconnect",
    "dep:uuid",
    "dep:tempfile",
]
mqtt = ["http", "dep:rumqttc"]
cli = [
    "dep:clap",
    "dep:clap_complete",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:gafctl-client",
    "dep:uuid",
]

[lints]
workspace = true

[workspace]
members = [
    "crates/gafctl-api",
    "crates/gafctl-client",
    "crates/gafctl-protocol",
    "crates/gafctl-bluetooth",
    "crates/gafctl-quickconnect",
]
default-members = [
    ".",
    "crates/gafctl-api",
    "crates/gafctl-client",
    "crates/gafctl-protocol",
    "crates/gafctl-bluetooth",
    "crates/gafctl-quickconnect",
]
resolver = "3"

[workspace.lints.clippy]
disallowed_macros = "deny"
panic = "deny"

[workspace.dependencies]
anyhow = "1.0.104"
backon = { version = "1.6.0", default-features = false }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "tracing"] }
btleplug = "0.13.3"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
assert_cmd = "2.2.2"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
httpdate = "1.0.3"
http-body-util = "0.1"
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
rand = { version = "0.9.5", default-features = false, features = ["thread_rng"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
base64 = "0.23.1"
thiserror = "2.0.21"
tempfile = "3.27.0"
strum = { version = "0.28.0", default-features = false, features = ["derive"] }
tokio = { version = "1.53.1", default-features = false }
tokio-util = { version = "0.7.18", default-features = false, features = ["rt"] }
tower = { version = "0.5", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
rumqttc = { package = "rumqttc-next", version = "0.34.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[dependencies]
futures-util = { workspace = true, optional = true }
anyhow.workspace = true
axum = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
clap_complete = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
rumqttc = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
gafctl-bluetooth = { path = "crates/gafctl-bluetooth" }
gafctl-quickconnect = { path = "crates/gafctl-quickconnect", optional = true }
gafctl-protocol = { path = "crates/gafctl-protocol" }
gafctl-api = { path = "crates/gafctl-api" }
gafctl-client = { path = "crates/gafctl-client", optional = true }

[[bin]]
name = "gafctl-server"
path = "src/main.rs"
required-features = ["http"]

[[bin]]
name = "gafctl"
path = "src/bin/gafctl.rs"
required-features = ["cli"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["http", "cli"]

[dev-dependencies]
tokio-util.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
assert_cmd.workspace = true
bytes.workspace = true
http-body-util.workspace = true
reqwest.workspace = true
gafctl-client = { path = "crates/gafctl-client" }
tower = { workspace = true, features = ["util"] }

[[test]]
name = "feature_isolation"
path = "tests/feature_isolation.rs"
required-features = ["http", "mqtt"]

[[test]]
name = "mqtt_delivery"
path = "tests/mqtt_delivery.rs"
required-features = ["mqtt"]
