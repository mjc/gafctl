services:
  gafctl:
    build: .
    image: gafctl:local
    restart: unless-stopped
    ports:
      - "${GAFCTL_LISTEN_IP:-127.0.0.1}:8787:8787"
    env_file:
      - path: ./gafctl.env
        required: false
    volumes:
      - gafctl-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=16m
volumes:
  gafctl-data:
