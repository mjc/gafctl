name: Home Assistant
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
permissions:
  contents: read
jobs:
  hacs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.revision || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        env:
          REPOSITORY_REF: ${{ inputs.revision || github.event.pull_request.head.sha || github.sha }}
        with:
          category: integration
          comment: false
          # Custom repository; register branding before catalog submission.
          ignore: brands
  hassfest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.revision || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3
