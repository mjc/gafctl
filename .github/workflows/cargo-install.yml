name: Cargo installation
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published crates.io version
        type: string
        required: true
  workflow_call:
    inputs:
      version:
        type: string
        required: true
permissions:
  contents: read
jobs:
  install:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
      - name: Install from crates.io and check both binaries
        run: nix run --accept-flake-config github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222 -- shell -- python3 packaging/check-native.py --version "$RELEASE_VERSION"
