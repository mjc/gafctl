name: Distribution
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: distribution-${{ github.repository }}
  queue: max
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.candidate.outputs.commit }}
      version: ${{ steps.candidate.outputs.version }}
      tag_object: ${{ steps.candidate.outputs.tag_object }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        shell: bash
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            packaging/check-release-candidate.sh "$RELEASE_TAG"
          else
            echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "version=$(packaging/version.sh)" >> "$GITHUB_OUTPUT"
          fi
  home-assistant:
    needs: candidate
    uses: ./.github/workflows/home-assistant.yml
    with:
      revision: ${{ needs.candidate.outputs.commit }}
  checks:
    needs: candidate
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          persist-credentials: false
      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
      - name: Check Rust and Home Assistant contracts
        run: nix run --accept-flake-config github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222 -- tasks run check:all
  build:
    needs: [candidate, checks, home-assistant]
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check versions
        shell: bash
        run: |
          version=$(packaging/version.sh)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build Linux packages
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: artifacts
          build-args: |
            PACKAGE_ARCH=${{ matrix.arch }}
            GAFCTL_REVISION=${{ github.sha }}
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=gafctl-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=gafctl-${{ matrix.arch }}
      - name: Build container image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          tags: gafctl:local
          build-args: GAFCTL_REVISION=${{ github.sha }}
          outputs: type=docker,dest=gafctl-image.tar
          cache-from: type=gha,scope=gafctl-${{ matrix.arch }}
      - name: Check exported packages and image
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          packaging/check-release-artifacts.sh "$PACKAGE_ARCH"
          docker load --input gafctl-image.tar
          packaging/check-release-image.sh gafctl:local "$PACKAGE_ARCH" "$GITHUB_SHA"
      - name: Check Home Assistant app source
        id: app
        shell: bash
        run: |
          revision=$(sed -n 's/^ARG GAFCTL_REVISION=//p' home-assistant/Dockerfile)
          test -n "$revision"
          git cat-file -e "$revision^{commit}"
          git diff --exit-code "$revision" HEAD -- Cargo.toml Cargo.lock rust-toolchain.toml .clippy.toml LICENSE LICENSE-QUICKCONNECT-REFERENCE.txt THIRD-PARTY-NOTICES.txt LICENSE-RUST-STDLIB.html src
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "version=$(packaging/version.sh)" >> "$GITHUB_OUTPUT"
          if [[ "${{ matrix.arch }}" == arm64 ]]; then arch=aarch64; else arch=amd64; fi
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
      - name: Build Home Assistant app image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: home-assistant
          tags: gafctl-app:local
          outputs: type=docker,dest=gafctl-app-image.tar
          build-args: |
            BUILD_VERSION=${{ steps.app.outputs.version }}
            BUILD_ARCH=${{ steps.app.outputs.arch }}
          cache-from: type=gha,scope=gafctl-app-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=gafctl-app-${{ matrix.arch }}
      - name: Check exported Home Assistant app image
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
          APP_REVISION: ${{ steps.app.outputs.revision }}
        run: |
          docker load --input gafctl-app-image.tar
          packaging/check-release-image.sh gafctl-app:local "$PACKAGE_ARCH" "$APP_REVISION"
      - name: Attest tested release artifacts
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*.deb
            dist/*.tar.gz
            gafctl-image.tar
            gafctl-app-image.tar
      - name: Preserve architecture-specific package provenance
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: mv dist/provenance.json "dist/provenance-$PACKAGE_ARCH.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.arch }}
          path: gafctl-image.tar
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-image-${{ matrix.arch }}
          path: gafctl-app-image.tar
          if-no-files-found: error
          retention-days: 7
  publish-crate:
    if: github.ref_type == 'tag'
    needs: [candidate, build]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
      EXPECTED_RELEASE_COMMIT: ${{ needs.candidate.outputs.commit }}
      EXPECTED_RELEASE_TAG_OBJECT: ${{ needs.candidate.outputs.tag_object }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck signed release candidate
        run: packaging/check-release-candidate.sh "$RELEASE_TAG"
      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd # v31.9.1
      - name: Package gafctl
        run: nix run --accept-flake-config github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222 -- shell -- cargo package --locked
      - name: Check bootstrap authentication
        id: bootstrap
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [[ -n "$BOOTSTRAP_TOKEN" ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate with crates.io
        if: steps.bootstrap.outputs.present != 'true'
        id: crates
        uses: rust-lang/crates-io-auth-action@9c067fc5d5c254b33978fed918cb50c032549d0e
      - name: Publish gafctl to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN || steps.crates.outputs.token }}
        run: nix run --accept-flake-config github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222 -- shell -- packaging/publish-crate.sh
  publish:
    if: github.ref_type == 'tag'
    needs: [candidate, build, install-crate]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
      EXPECTED_RELEASE_COMMIT: ${{ needs.candidate.outputs.commit }}
      EXPECTED_RELEASE_TAG_OBJECT: ${{ needs.candidate.outputs.tag_object }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck signed release candidate
        run: packaging/check-release-candidate.sh "$RELEASE_TAG"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Prepare package checksums
        run: (cd dist && sha256sum ./*.deb ./*.tar.gz ./provenance-*.json > SHA256SUMS)
      - name: Create image artifact directory
        id: image-artifacts
        run: echo "path=$(mktemp -d "$RUNNER_TEMP/gafctl-images.XXXXXX")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-*
          path: ${{ steps.image-artifacts.outputs.path }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check and publish release
        env:
          IMAGE_ARTIFACT_DIRECTORY: ${{ steps.image-artifacts.outputs.path }}
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#v}"
          packaging/publish-release.sh "$image" "$version" "$IMAGE_ARTIFACT_DIRECTORY"
  install-crate:
    needs: [candidate, publish-crate]
    uses: ./.github/workflows/cargo-install.yml
    with:
      version: ${{ needs.candidate.outputs.version }}
